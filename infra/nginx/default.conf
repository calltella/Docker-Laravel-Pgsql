server {
    listen 80;
    server_name dev.apline.local;

    client_max_body_size 10M;

    error_log /var/log/nginx/debug.log debug;
    access_log /var/log/nginx/access.log;
    
    # ==========================================
    # サイト legacy (/legacy/)
    # ==========================================
    location ^~ /legacy {
        alias /var/www/html/legacy/public;
        add_header X-Debug-Location "legacy-prefix" always;
        index index.php;

        # 静的ファイルが存在しない場合、Laravelのindex.phpへ送る
        try_files $uri $uri/ @legacy;

        location ~ \.php$ {
            # alias指定時のPHP実行のための設定
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass legacy:9000;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;

            fastcgi_param DEBUG_URI $uri;
            fastcgi_param DEBUG_REQUEST_URI $request_uri;
        }
    }
    # サイトlegacy専用の内部リダイレクト
    location @legacy {
        rewrite ^/legacy/(.*)$ /legacy/index.php?/$1 last;
    }

    # 静的ファイル
    location ~ ^/legacy/(storage|build|img|css|js)/(.+\.(?:gif|png|jpe?g|svg|webp|ico|css|js|woff2?))$ {
        add_header X-Debug-Location "legacy-static" always;
        alias /var/www/html/legacy/public/$1/$2;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # /laravel へのアクセスは /legacy へリダイレクト
    location = /laravel {
        return 301 /legacy;
    }
    location ^~ /laravel/ {
        rewrite ^/laravel/(.*)$ /legacy/$1 permanent;
    }

    # ==========================================
    # サイト apline (/apline/)
    # ==========================================
    location ^~ /apline {
        alias /var/www/html/laravel/public;
        add_header X-Debug-Location "apline-prefix" always;
        index index.php;

        # 静的ファイルが存在しない場合、Laravelのindex.phpへ送る
        try_files $uri $uri/ @apline;

        location ~ \.php$ {
          # alias指定時のPHP実行のための設定
          fastcgi_split_path_info ^(.+\.php)(/.+)$;
          fastcgi_pass php:9000;
          fastcgi_param SCRIPT_FILENAME $request_filename;
          include fastcgi_params;

          # Supabaseのアクセストークン（JWT）がセッションに保存される
          #  → Laravelのセッションクッキーが大きくなる
          #  → PHPのレスポンスヘッダーがnginxのバッファ上限を超える
          #  → 502 "upstream sent too big header"

          # ヘッダーバッファを拡張
          fastcgi_buffer_size 32k;
          fastcgi_buffers 8 16k;
          fastcgi_busy_buffers_size 64k;
        
          fastcgi_param DEBUG_URI $uri;
          fastcgi_param DEBUG_REQUEST_URI $request_uri;
        }
    }
    # サイトaplineリダイレクト専用の内部リダイレクト
    location @apline {
        rewrite ^/apline/(.*)$ /apline/index.php?/$1 last;
    }

    # 静的ファイル
    location ~ ^/apline/(storage|build|img|css|js)/(.+\.(?:gif|png|jpe?g|svg|webp|ico|css|js|woff2?))$ {
        add_header X-Debug-Location "apline-static" always;
        alias /var/www/html/laravel/public/$1/$2;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # pgAdmin4
    location /pgadmin4/ {
        proxy_pass http://pgadmin4:80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin4;
        proxy_redirect off;
        proxy_cookie_path ~^/ /pgadmin4;
        proxy_read_timeout 300s;
    }
}