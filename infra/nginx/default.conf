server {
    listen 80;
    server_name dev.apline.local;

    client_max_body_size 10M;

    error_log /var/log/nginx/debug.log debug;
    access_log /var/log/nginx/access.log;

    root /var/www/html/laravel/public;
    index index.php;

    # pgadmin4 がDNSへ登録されていない場合、nginxのリバースプロキシで名前解決できないため、IPアドレスを直接指定する
    set $pgadmin http://pgadmin4:80;

    # ルート → /laravel/ にリダイレクト
    location = / {
        return 301 /laravel/;
    }

    # /laravel → /laravel/ にリダイレクト
    location = /apline {
        return 301 /laravel/;
    }
    location = /laravel {
        return 301 /laravel/;
    }

    # Laravelアプリケーション全体（/laravel/*）
    location /laravel/ {
        add_header X-Debug-Location "laravel-prefix" always;
        try_files $uri $uri/ /laravel/index.php?$query_string;
    }

    # PHPファイルの処理（/laravel/ 以下の全て）
    location ~ ^/laravel/(.+\.php)$ {
        add_header X-Debug-Location "laravel-php" always;
        alias /var/www/html/laravel/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param DEBUG_URI $uri;
        fastcgi_param DEBUG_REQUEST_URI $request_uri;
        include fastcgi_params;

        # Supabaseのアクセストークン（JWT）がセッションに保存される
        #  → Laravelのセッションクッキーが大きくなる
        #  → PHPのレスポンスヘッダーがnginxのバッファ上限を超える
        #  → 502 "upstream sent too big header"

        # ヘッダーバッファを拡張
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 64k;
    }

    # 静的ファイル
    location ~ ^/laravel/(storage|build|img|css|js)/(.+\.(?:gif|png|jpe?g|svg|webp|ico|css|js|woff2?))$ {
        add_header X-Debug-Location "laravel-static" always;
        alias /var/www/html/laravel/public/$1/$2;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Sanctum CSRF
    location = /laravel/sanctum/csrf-cookie {
        add_header X-Debug-Location "laravel-sanctum" always;
        try_files $uri $uri/ /laravel/index.php?$query_string;
    }

    # API
    location /laravel/api/ {
        add_header X-Debug-Location "laravel-api" always;
        try_files $uri $uri/ /laravel/index.php?$query_string;
    }

    # pgAdmin4
    location /pgadmin4/ {
        proxy_pass $pgadmin;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin4;   # ← これを追加
        proxy_redirect off;
        proxy_cookie_path ~^/ /pgadmin4;
        proxy_read_timeout 300s;
    }
}